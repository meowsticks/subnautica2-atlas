[package]
name = "survivors-atlas"
version = "3.4.0"
description = "Subnautica 2 Survivor's Atlas — desktop overlay build"
authors = ["Dustin"]
license = "MIT"
repository = ""
default-run = "survivors-atlas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["shell-open", "window-set-always-on-top", "window-set-decorations", "window-close", "window-hide", "window-minimize", "window-show", "window-start-dragging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
