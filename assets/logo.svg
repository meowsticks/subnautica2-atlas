<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Survivor's Atlas">
  <defs>
    <linearGradient id="atlasGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <radialGradient id="atlasCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer hex frame -->
  <polygon points="60,6 110,32 110,88 60,114 10,88 10,32"
           fill="none" stroke="url(#atlasGrad)" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="60,14 102,36 102,84 60,106 18,84 18,36"
           fill="none" stroke="rgba(0,229,255,0.25)" stroke-width="1"/>

  <!-- Inverted dive triangle -->
  <path class="triangle" d="M38 40 L82 40 L60 92 Z"
        fill="none" stroke="#00e5ff" stroke-width="1.8"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Sonar core -->
  <circle cx="60" cy="58" r="22" fill="url(#atlasCore)"/>
  <circle cx="60" cy="58" r="3.5" fill="#00e5ff"/>

  <!-- Three concentric ripples -->
  <circle class="ring" cx="60" cy="58" r="10" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <circle class="ring r2" cx="60" cy="58" r="10" fill="none" stroke="#4dd0e1" stroke-width="1.2" opacity="0.5"/>
  <circle class="ring r3" cx="60" cy="58" r="10" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>

  <!-- Subtle "II" mark for Subnautica 2 -->
  <g opacity="0.85" font-family="Cinzel, serif" font-weight="900" font-size="12" fill="#ff6b35" text-anchor="middle">
    <text x="60" y="103" letter-spacing="2">II</text>
  </g>
</svg>
